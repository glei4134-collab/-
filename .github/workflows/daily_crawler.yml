name: 🕷️ 每日自动行情抓取

on:
  schedule:
    # 每天北京时间中午 12 点运行 (UTC 时间凌晨 4 点)
    - cron: '0 4 * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上通过按钮手动触发测试

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许机器人往你的仓库提交更新后的数据库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas numpy scikit-learn torch

      - name: 运行爬虫脚本
        run: python crawler.py

      - name: 提交并推送到 GitHub
        run: |
          git config --global user.name "AI-Crawler-Bot"
          git config --global user.email "bot@example.com"
          git add memory_market.db
          # 如果数据库没变化就不提交，有变化就推送
          git commit -m "📈 自动更新今日真实行情 [skip ci]" || echo "No changes to commit"
          git push
